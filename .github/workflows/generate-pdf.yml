name: Generate CV exports

# Produces exports/cv-pt.pdf / exports/cv-en.pdf and exports/cv-pt.md /
# exports/cv-en.md. The repo root stays code-only.
#
# ── PDFs ──
# The files the header's "Baixar PDF" button downloads (see js/main.js:
# setupDownloadButton). Always rendered in the light theme: the button no
# longer lets a visitor choose a theme before downloading, and light is the
# safer default for a document that may end up printed on paper by whoever
# receives it.
#
# scripts/generate-pdfs.js renders them with Puppeteer against
# ?theme=light&lang=<pt|en> — the same query-param override used for manual
# testing (see the head-inline theme script and getUrlParam() in main.js).
# This is deliberately NOT window.print() through a system dialog: that path
# is what rasterises a saved PDF when the OS default printer is something
# like "Microsoft Print to PDF" (see the in-page hint next to Ctrl+P).
#
# It is also deliberately NOT a bare `chrome --print-to-pdf` CLI call, which
# is what this workflow used originally. That approach hung for 6 hours
# (GitHub's default job timeout) on its first two real runs, without ever
# producing a PDF — undetected until much later. Confirmed by testing six
# different flag combinations, and finally by smoke-testing a trivial
# `data:text/html,<h1>hi</h1>` page with no server or CSS involved at all:
# --print-to-pdf itself never returns on this runner + Chrome-for-Testing
# build, for any input. Puppeteer drives the same browser through the
# DevTools Protocol's Page.printToPDF instead, a path with far more
# real-world CI mileage — see generate-pdfs.js's own header comment.
#
# The verify step re-checks the exact property that matters — the PDF must
# stay vector text with clickable links — so a future print.css change that
# accidentally reintroduces a compositing trigger (backdrop-filter, a fixed
# background, ...) fails CI loudly instead of shipping a silently-broken PDF.
#
# ── Markdown ──
# scripts/generate-resume-md.js renders js/i18n.js (the single source of
# truth for every translated string) straight into Markdown — no browser at
# all, just Node's built-ins. See that script's own header comment for why
# it loads i18n.js/main.js into a vm context instead of re-parsing the data.
#
# Puppeteer is the only npm dependency anywhere in this repo, and it's a
# devDependency used only by this workflow — the deployed site (index.html,
# css/, js/) has zero dependencies and no build step either way.

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "assets/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/generate-pdf.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: generate-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate Markdown résumé (pt + en)
        run: node scripts/generate-resume-md.js

      - name: Generate PDFs (light theme, pt + en)
        run: node scripts/generate-pdfs.js

      - name: Verify PDFs stay vector text with clickable links
        run: |
          set -e
          fail=0
          for lang in pt en; do
            f="exports/cv-$lang.pdf"
            fonts=$(grep -aoE '/Type */Font' "$f" | wc -l)
            images=$(grep -aoE '/Subtype */Image' "$f" | wc -l)
            links=$(grep -aoE '/Subtype */Link' "$f" | wc -l)
            echo "$f: fonts=$fonts images=$images links=$links"
            if [ "$fonts" -eq 0 ]; then
              echo "::error::$f has no embedded fonts — the page likely failed to render"
              fail=1
            fi
            if [ "$images" -ne 0 ]; then
              echo "::error::$f was rasterized ($images image objects) — check print.css for a new compositing trigger (backdrop-filter, fixed background, box-shadow, non-1 opacity, ...) first. If none of those are it: a colour emoji in badge/text content is the other known cause — every glyph a font stores as a bitmap embeds as an RGB+SMask image pair (2 images per emoji), which is what the original 6 turned out to be, nothing to do with CSS at all. Wrap the emoji in its own element and hide it in print, same as .badge-icon."
              fail=1
            fi
            if [ "$links" -eq 0 ]; then
              echo "::error::$f has no clickable link annotations"
              fail=1
            fi
          done
          exit $fail

      - name: Commit and push if the exports changed
        run: |
          set -e
          git add exports/cv-pt.pdf exports/cv-en.pdf exports/cv-pt.md exports/cv-en.md
          if git diff --cached --quiet; then
            echo "Exports unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate PDF/Markdown exports"
          git push
