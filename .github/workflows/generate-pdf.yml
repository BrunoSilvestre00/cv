name: Generate CV exports

# Produces cv-pt.pdf / cv-en.pdf at the repo root and exports/cv-pt.md /
# exports/cv-en.md.
#
# ── PDFs ──
# The files the header's "Baixar PDF" button downloads (see js/main.js:
# setupDownloadButton). Always rendered in the light theme: the button no
# longer lets a visitor choose a theme before downloading, and light is the
# safer default for a document that may end up printed on paper by whoever
# receives it.
#
# Generated by Chrome's own PDF engine (--print-to-pdf) against
# ?theme=light&lang=<pt|en>, the same query-param override used for manual
# testing — see the head-inline theme script and getUrlParam() in main.js.
# This is deliberately NOT window.print() through a system dialog: that path
# is what rasterises a saved PDF when the OS default printer is something
# like "Microsoft Print to PDF" (see the in-page hint next to Ctrl+P). Chrome
# generating its own PDF server-side never goes through a print driver at all.
#
# The verify step re-checks the exact property that matters — the PDF must
# stay vector text with clickable links — so a future print.css change that
# accidentally reintroduces a compositing trigger (backdrop-filter, a fixed
# background, ...) fails CI loudly instead of shipping a silently-broken PDF.
#
# ── Markdown ──
# scripts/generate-resume-md.js renders js/i18n.js (the single source of
# truth for every translated string) straight into Markdown — no Chrome, no
# server, just Node's built-ins. See that script's own header comment for why
# it loads i18n.js/main.js into a vm context instead of re-parsing the data.

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/generate-pdf.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: generate-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Markdown résumé (pt + en)
        run: node scripts/generate-resume-md.js

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Serve the site
        run: |
          set -e
          python3 -m http.server 8080 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8080/index.html > /dev/null && exit 0
            sleep 0.5
          done
          echo "::error::static server never came up"; exit 1

      - name: Smoke test --print-to-pdf against a trivial page (diagnostic)
        run: |
          set -e
          CHROME="${{ steps.setup-chrome.outputs.chrome-path }}"
          profile="$(mktemp -d)"
          rm -f /tmp/smoke.pdf
          timeout 20s "$CHROME" \
            --headless=new --disable-gpu --disable-dev-shm-usage --no-sandbox \
            --no-pdf-header-footer \
            --user-data-dir="$profile" \
            --print-to-pdf=/tmp/smoke.pdf \
            "data:text/html,<h1>hi</h1>" \
            || echo "smoke test exited $? (non-fatal, diagnostic only)"
          if [ -s /tmp/smoke.pdf ]; then
            echo "SMOKE TEST: OK, $(stat -c%s /tmp/smoke.pdf) bytes — print-to-pdf works in general on this runner"
          else
            echo "SMOKE TEST: FAILED — print-to-pdf produced nothing even for a trivial data: URL"
          fi

      - name: Generate PDFs (light theme, pt + en)
        run: |
          set -e
          CHROME="${{ steps.setup-chrome.outputs.chrome-path }}"
          for lang in pt en; do
            profile="$(mktemp -d)" # fresh profile per invocation — a shared
                                    # one can serve a stale render on the 2nd run
            rm -f "cv-$lang.pdf"
            # The first two runs of this workflow (merges of PR #3 and #4) hung
            # for 6 hours each — GitHub's default job timeout — and were
            # cancelled without ever producing a PDF, undetected until now.
            #
            # Root cause, found by watching dispatched runs directly: on this
            # runner (no GPU, --no-sandbox), --print-to-pdf's Chrome process
            # never exits on its own — but the PDF itself gets written to disk
            # just fine, well within seconds. Confirmed by testing five flag
            # combinations (both headless modes, with/without
            # --virtual-time-budget, with/without
            # --run-all-compositor-stages-before-draw, with Google Fonts
            # blocked at the DNS level): every single one hung for exactly the
            # same duration regardless, which only makes sense if the file was
            # already sitting there complete the whole time — the process
            # exiting was never actually the thing standing between us and a
            # PDF. (--run-all-compositor-stages-before-draw stays anyway: it's
            # the pairing Chromium's own docs recommend for headless
            # screenshot/PDF capture, and costs nothing to keep.)
            #
            # So: launch in the background, poll for the file directly instead
            # of waiting on the process to exit, and kill it as soon as the
            # file's size is stable across two checks (guards against reading
            # it mid-write). A genuine render failure still surfaces once the
            # poll window elapses with nothing written.
            "$CHROME" \
              --headless=new --disable-gpu --disable-dev-shm-usage --no-sandbox \
              --no-pdf-header-footer \
              --run-all-compositor-stages-before-draw --virtual-time-budget=15000 \
              --user-data-dir="$profile" \
              --print-to-pdf="cv-$lang.pdf" \
              "http://localhost:8080/index.html?lang=$lang&theme=light" &
            chrome_pid=$!
            produced=0
            prev_size=-1
            for i in $(seq 1 60); do
              if [ -s "cv-$lang.pdf" ]; then
                size=$(stat -c%s "cv-$lang.pdf")
                # require the size to be stable across two checks 0.5s apart —
                # a single non-empty read could catch the file mid-write
                if [ "$size" = "$prev_size" ]; then
                  produced=1
                  break
                fi
                prev_size=$size
              fi
              if ! kill -0 "$chrome_pid" 2>/dev/null; then
                sleep 0.5 # give a just-exited process's last write a moment to land
                [ -s "cv-$lang.pdf" ] && produced=1
                break
              fi
              sleep 0.5
            done
            kill "$chrome_pid" 2>/dev/null || true
            wait "$chrome_pid" 2>/dev/null || true
            if [ "$produced" -ne 1 ]; then
              echo "::error::cv-$lang.pdf was never produced (30s poll)"
              exit 1
            fi
            echo "cv-$lang.pdf produced ($(stat -c%s "cv-$lang.pdf") bytes)"
          done

      - name: Verify PDFs stay vector text with clickable links
        run: |
          set -e
          fail=0
          for lang in pt en; do
            f="cv-$lang.pdf"
            fonts=$(grep -aoE '/Type */Font' "$f" | wc -l)
            images=$(grep -aoE '/Subtype */Image' "$f" | wc -l)
            links=$(grep -aoE '/Subtype */Link' "$f" | wc -l)
            echo "$f: fonts=$fonts images=$images links=$links"
            if [ "$fonts" -eq 0 ]; then
              echo "::error::$f has no embedded fonts — the page likely failed to render"
              fail=1
            fi
            if [ "$images" -ne 0 ]; then
              echo "::error::$f was rasterized ($images image objects) — a print.css change probably reintroduced a compositing trigger (backdrop-filter, fixed background, box-shadow, ...)"
              fail=1
            fi
            if [ "$links" -eq 0 ]; then
              echo "::error::$f has no clickable link annotations"
              fail=1
            fi
          done
          exit $fail

      - name: Commit and push if the exports changed
        run: |
          set -e
          git add cv-pt.pdf cv-en.pdf exports/cv-pt.md exports/cv-en.md
          if git diff --cached --quiet; then
            echo "Exports unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate PDF/Markdown exports"
          git push
